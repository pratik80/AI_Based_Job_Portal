<!doctype html>
<html lang="en">

<head>
    <style>body{
        background-image: url("../static/images/job1.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        
    }
    </style>
    
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/style.css">

    <title>JOB PORTAL</title>
</head>

<header>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <h1>JOB PORTAL</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    
                    
                </ul>
            </div>
            <button type="button" class="btn btn-danger btn mt-2"
                onclick="location.href = 'User.html';">Logout</button>
            
        </div>
    </nav>
</header>

<body>

    <div class="container shadow p-3 mb-5 bg-body rounded" >
        <h2>Below are the jobs posted by companies.</h2>
        
        <br><br>
        {%- if check %}

        No jobs posted by any company. Please check back later.

        {%- else %}

        <table class="table">
            {%- for job in jobs %}

            <thead>
                <th scope="col" class="table-dark rounded">{{loop.index}}) {{job.jobtitle}}
                </th>
            </thead>
            <tbody>
              <tr>
                <td>             
                    <p class="fs-6">
                    <form action="job.html" method="post" enctype="multipart/form-data">
                        <b>Job Description:</b>
                            <pre >
                            {{job.jobdesc}}
                            </pre>
                          
                        <input type="text" value={{job.email}} name="Remail" style="display: none;">
                        <br>
                        <label for="resume"><b>Upload Resume:</b> </label>
                        <input type="file" name="resume" required>
                        <br>
                        <button type="submit" class="btn btn-primary">Apply</button>
                    </form>
                    </p></td>
              </tr>
            </tbody>
            {%- endfor %}

          </table>

        {% endif %}

    </div>





   
</body>

</html>
