<body>
  {% if check %}
  <div class="container shadow p-3 mb-5 bg-body rounded" style="background-color: white;">
    <h2>Create a job notice for the applicants.</h2>
    <br>
    <form action="jobnotice.html" method="post">
      <div class="form-floating mb-3">
        <label for="">Enter the job title:</label>
        <input type="text" class="form-control" id="floatingInput" placeholder="Write here"
          style="border: 1px black solid;" name="formJobtitle">
      </div>
      <div class="form-floating">
        <label for="floatingTextarea2">Enter job description:</label>
        <textarea class="form-control" placeholder="Write here" id="floatingTextarea2"
          style="height: 100px;border: 1px black solid;" name="formJobdesc"></textarea>
      </div>
      <br>
      <button type="submit" class="btn btn-primary">Post</button>
    </form>
  </div>
  {% else %}
  <div class="container shadow p-3 mb-5 bg-body rounded" style="background-color: white;">
    <h2>Job Posted</h2>
    <br>
    <p style="font-size: 20px;"><b>Job Title:</b>  {{notice.jobtitle}}</p>
    <p style="font-size: 20px;"><b> Job Description:</b><br><pre>{{notice.jobdesc}}</pre></p>
    <p style="font-size: 20px;"><b>Applicants Count:</b> {{count}}</p>
    <button type="button" class="btn btn-primary btn mt-2" onclick="location.href='shortlist.html'">Shortlist</button> 
    <button type="button" class="btn btn-danger btn mt-2" onclick="location.href='deletejd/{{username}}'">Delete</button>  
 
  </div>
  {% endif %}



</html>
